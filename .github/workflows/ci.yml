name: CI

# Pull requests: check and local tests only, no secrets.
# Push to main: the same, then deploy and test the deployment.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# One run per branch at a time, so an older commit cannot deploy over a newer one.
concurrency:
  group: ci-${{ github.ref }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commits: a moved tag must not reach the deploy token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test

  deploy:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commits: a moved tag must not reach the deploy token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      # The token and settings are set per step, so that dependency install scripts never see them.
      - run: npm ci
      - name: Require settings
        # Without BASE_URL the tests would not be testing the deployment.
        run: test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID" && test -n "$BASE_URL"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          BASE_URL: ${{ vars.BASE_URL }}
      - run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          # Optional: unset means the limits in wrangler.toml.
          REGISTER_LIMIT: ${{ vars.REGISTER_LIMIT }}
          UPLOAD_LIMIT: ${{ vars.UPLOAD_LIMIT }}
      # A new version takes a while to be served everywhere. Tests started at once hit the old one.
      # ponytail: fixed wait. If this still flakes, have the Worker report its version and poll for it.
      - run: sleep 30
      - run: npm test
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          BASE_URL: ${{ vars.BASE_URL }}
