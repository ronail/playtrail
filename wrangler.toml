name = "playtrail"
main = "src/index.ts"
compatibility_date = "2026-11-01"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "playtrail-logs"

[[ratelimits]]
name = "REGISTER_LIMIT"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "UPLOAD_LIMIT"
namespace_id = "1002"
simple = { limit = 10, period = 60 }
